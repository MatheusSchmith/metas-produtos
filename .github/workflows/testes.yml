# Testes do back-end (sem rede: Datasphere falso e dados simulados).
name: Testes do back-end

on:
  push:
    paths: ["backend/**", ".github/workflows/testes.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python -m unittest discover -s tests -t . -v
