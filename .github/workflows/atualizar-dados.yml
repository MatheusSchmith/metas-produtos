# Atualiza a API (api/v1/*.json) a partir do SAP Datasphere (OData) e republica o site quando algo mudou.
#
# Secrets  (Settings > Secrets and variables > Actions > Secrets):
#   DATASPHERE_CLIENT_ID, DATASPHERE_CLIENT_SECRET,
#   DATASPHERE_TENANT_URL, DATASPHERE_TOKEN_URL, DATASPHERE_SPACE, DATASPHERE_ASSET
# Tudo em Secrets (e não Variables) porque o repositório é público: o GitHub troca o valor dos Secrets por ***
# no log da execução, que qualquer um pode abrir. Pelo mesmo motivo o log não é guardado como artefato.
name: Atualizar dados (Datasphere)

on:
  schedule:
    # de hora em hora, seg-sex, 07:05-18:05 de Brasília (10:05-21:05 UTC), para não sobrecarregar o Datasphere.
    # Minuto 05 em vez de 00 porque na hora cheia o GitHub atrasa mais. Pode atrasar alguns minutos mesmo assim.
    - cron: "5 10-21 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "real = Datasphere; simulado = dados fictícios (para o front antes das credenciais)"
        type: choice
        options: [real, simulado]
        default: real

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mudou: ${{ steps.gerar.outputs.mudou }}
    env:
      DATASPHERE_TENANT_URL: ${{ secrets.DATASPHERE_TENANT_URL }}
      DATASPHERE_TOKEN_URL: ${{ secrets.DATASPHERE_TOKEN_URL }}
      DATASPHERE_SPACE: ${{ secrets.DATASPHERE_SPACE }}
      DATASPHERE_ASSET: ${{ secrets.DATASPHERE_ASSET }}
      DATASPHERE_CLIENT_ID: ${{ secrets.DATASPHERE_CLIENT_ID }}
      DATASPHERE_CLIENT_SECRET: ${{ secrets.DATASPHERE_CLIENT_SECRET }}
      SAIDA_DIR: ../api
      PYTHONIOENCODING: utf-8
    steps:
      # ref: main pega a versão mais recente na hora em que o job começa, e não a do momento do disparo: uma
      # execução que esperou outra terminar (concurrency) já parte dos dados que a outra gravou.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Gerar a API
        id: gerar
        working-directory: backend
        env:
          EVENTO: ${{ github.event_name }}
          MODO: ${{ inputs.modo }}
        run: |
          ARGS=()
          if [ "$EVENTO" = "workflow_dispatch" ]; then ARGS+=(--forcar); fi
          if [ "$MODO" = "simulado" ]; then ARGS+=(--simulado); fi
          python scripts/gerar.py "${ARGS[@]}"

      - name: Commit dos dados
        if: steps.gerar.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/
          git diff --cached --quiet && exit 0
          git commit -m "dados: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # Se outra execução gravou dados no meio tempo, o conflito em api/ fica com os dados desta, que são os
          # mais novos (no rebase, -X theirs = o commit desta execução).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  publicar:
    needs: gerar
    if: needs.gerar.outputs.mudou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
